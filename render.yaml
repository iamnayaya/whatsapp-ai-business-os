# Render blueprint for WhatsApp AI Business OS.
#
# Creates: web service (API + webhook receiver), background worker, managed
# Postgres, and managed Redis. Secrets (marked `sync: false`) must be filled in
# the Render dashboard after the first deploy — never commit real values.
#
# Before deploying:
#   1. Change `repo` below to your GitHub repo.
#   2. Read docs/DEPLOYMENT.md for where each secret comes from.
#   3. Set the `sync: false` env vars in the Render dashboard for BOTH services.
#
# One-click import: Render dashboard -> New -> Blueprint -> pick this repo.

services:
  # ---------------------------------------------------------------------------
  # API: WhatsApp webhook receiver + /health + owner dashboard + kill switch.
  # ---------------------------------------------------------------------------
  - type: web
    name: wabiz-api
    runtime: docker
    repo: https://github.com/YOUR_ORG/YOUR_REPO.git
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    healthCheckTimeout: 120
    envVars:
      - key: SERVICE
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: WEBHOOK_PATH
        value: /webhook/whatsapp
      - key: DATABASE_URL
        fromDatabase:
          name: wabiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wabiz-redis
          type: redis
          property: connectionString
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_PHONE_NUMBER
        sync: false
      - key: BUSINESS_CURRENCY
        value: NGN
      - key: BUSINESS_TIMEZONE
        value: Africa/Lagos
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Worker: BullMQ consumer — runs the AI agent, follow-ups, payments, monitor.
  # ---------------------------------------------------------------------------
  - type: worker
    name: wabiz-worker
    runtime: docker
    repo: https://github.com/YOUR_ORG/YOUR_REPO.git
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE
        value: worker
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wabiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wabiz-redis
          type: redis
          property: connectionString
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: TRANSCRIBER_MIN_CONFIDENCE
        value: "0.5"
      - key: FOLLOWUP_SCAN_CRON
        value: 0 */15 * * * *
      - key: FOLLOWUP_FIRST_DELAY_MINUTES
        value: "120"
      - key: FOLLOWUP_SECOND_DELAY_MINUTES
        value: "1440"
      - key: FOLLOWUP_QUIET_START
        value: "21"
      - key: FOLLOWUP_QUIET_END
        value: "9"
      - key: FOLLOWUP_MAX_ATTEMPTS
        value: "2"
      - key: REFUND_ESCALATION_THRESHOLD
        value: "50000"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_PHONE_NUMBER
        sync: false
      - key: BUSINESS_CURRENCY
        value: NGN
      - key: BUSINESS_TIMEZONE
        value: Africa/Lagos
      # --- Monitoring + alerting (runs inside the worker) ---
      - key: MONITOR_ENABLED
        value: "true"
      - key: MONITOR_INTERVAL_MINUTES
        value: "5"
      - key: MONITOR_WINDOW_MINUTES
        value: "15"
      - key: MONITOR_FAILED_MESSAGES_THRESHOLD
        value: "5"
      - key: MONITOR_FAILED_EVENTS_THRESHOLD
        value: "3"
      - key: MONITOR_PENDING_BACKLOG_MINUTES
        value: "10"
      - key: MONITOR_PENDING_BACKLOG_THRESHOLD
        value: "5"
      - key: MONITOR_AI_ERROR_THRESHOLD
        value: "10"
      - key: MONITOR_ALERT_COOLDOWN_MINUTES
        value: "30"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_SMTP_HOST
        sync: false
      - key: ALERT_SMTP_PORT
        sync: false
      - key: ALERT_SMTP_SECURE
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASS
        sync: false

databases:
  - name: wabiz-db
    databaseName: whatsapp_biz_os
    plan: basic

redis:
  - name: wabiz-redis
    plan: starter

# ---------------------------------------------------------------------------
# After the first deploy, run migrations once (Render -> your db -> Jobs tab
# or any one-off command) with DATABASE_URL set to the managed Postgres URL:
#   npm run db:deploy        # prisma migrate deploy
#   npm run db:seed          # optional sample catalog
# ---------------------------------------------------------------------------